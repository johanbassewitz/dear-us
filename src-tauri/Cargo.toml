[package]
name = "dear-us"
version = "1.0.3"
description = "Dear Us — a private shared relationship journal"
edition = "2021"

[lib]
name = "dear_us_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
blake3 = "1"
infer = "0.22"
kamadak-exif = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
uuid = { version = "1", features = ["v7"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-notification = "2"
tlock_age = { version = "0.0.10", features = ["armor"] }
ureq = { version = "2", features = ["json"] }
hex = "0.4"
chacha20poly1305 = { version = "0.10", features = ["std"] }
bip39 = "2"
sha2 = "0.10"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
# Microsoft Store purchases (Store edition only)
windows = { version = "0.61", optional = true, features = ["Services_Store", "Foundation", "Foundation_Collections", "Win32_Foundation", "Win32_UI_Shell"] }

[features]
# Two editions from one codebase:
# - default ("personal"): bring-your-own Supabase + own Gemini key, GitHub auto-updates.
# - store: Microsoft Store edition: Dear Us Cloud, plans, Cupid gateway, Store purchases,
#   no self-updater (the Store updates the app). Build with --no-default-features --features store.
default = ["updater"]
updater = ["dep:tauri-plugin-updater", "dep:tauri-plugin-process"]
store = ["dep:windows"]

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
